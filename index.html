<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">GRAND SLAM WORD TEST</p>
      <h1>グランドスラム英単語準２級対応</h1>
      <p>青葉ボーイズ専用チェックテストアプリ</p>
    </header>

    <section id="startScreen" class="card">
      <h2>レベルを選ぶ</h2>
      <div class="levels">
        <button class="level" data-level="S"><span>LEVEL 1</span><strong>S：最頻出</strong><small>まずはここから</small></button>
        <button class="level" data-level="A"><span>LEVEL 2</span><strong>A：必須</strong><small>合格に向けて強化</small></button>
        <button class="level" data-level="B"><span>LEVEL 3</span><strong>B：合格圏内</strong><small>仕上げに挑戦</small></button>
      </div>
      <div class="rules">
        <h3>ルール</h3>
        <ul>
          <li>10問連続で正解すると <b>合格</b></li>
          <li>間違い（おてつき）は2回まで</li>
          <li>2回間違えると <b>不合格</b></li>
          <li>4択から日本語の意味を選択</li>
        </ul>
      </div>
      <p class="source">単語データ：アップロードされた「英検準2級『超厳選300』単語帳」</p>
    </section>

    <section id="quizScreen" class="card hidden">
      <div class="topbar">
        <button id="quitBtn" class="textBtn">レベル選択に戻る</button>
        <span id="levelLabel" class="badge"></span>
      </div>
      <div id="timer" class="timer">残り 10秒</div>
      <div class="progressRow">
        <span id="streakText">0 / 10</span>
        <span id="mistakeText">おてつき 0 / 2</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>

      <div class="question">
        <p class="questionLabel">この英単語の意味は？</p>
        <h2 id="word"></h2>
      </div>

      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </section>

    <section id="resultScreen" class="card result hidden">
      <div id="resultIcon" class="resultIcon"></div>
      <p class="eyebrow">RESULT</p>
      <h2 id="resultTitle"></h2>
      <p id="resultMessage"></p>
      <div class="stats">
        <div><span>連続正解</span><strong id="resultStreak"></strong></div>
        <div><span>おてつき</span><strong id="resultMistakes"></strong></div>
      </div>
      <div class="resultActions">
        <button id="retryBtn" class="primary">もう一度挑戦</button>
        <button id="homeBtn" class="secondary">レベル選択へ</button>
      </div>
    </section>
  </main>

let level = null;
let pool = [];
let questionQueue = [];
let queueIndex = 0;
let current = null;
let streak = 0;
let mistakes = 0;
let locked = false;
let timerInterval = null;
let timeLeft = 10;

const $ = (id) => document.getElementById(id);
const startScreen = $("startScreen");
const quizScreen = $("quizScreen");
const resultScreen = $("resultScreen");

const levelNames = {S:"LEVEL 1｜S：最頻出", A:"LEVEL 2｜A：必須", B:"LEVEL 3｜B：合格圏内"};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function stopTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }
}

function updateTimer(){
  $("timer").textContent=`残り ${timeLeft}秒`;
  $("timer").classList.toggle("danger", timeLeft<=3);
}

function startTimer(){
  stopTimer();
  timeLeft=10;
  updateTimer();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      stopTimer();
      handleTimeout();
    }
  },1000);
}

function startGame(selectedLevel){
  level=selectedLevel;
  pool=shuffle(WORDS.filter(w=>w.rank===level));
  questionQueue=shuffle(pool);
  queueIndex=0;
  streak=0; mistakes=0; locked=false;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  $("levelLabel").textContent=levelNames[level];
  renderQuestion();
}

function getNextQuestion(){
  // 10問以上を同じ周回で重複させないため、シャッフルしたキューから順番に出題。
  // 単語数が尽きたら再シャッフルして次の周回へ。
  if(queueIndex>=questionQueue.length){
    questionQueue=shuffle(pool);
    queueIndex=0;
  }
  return questionQueue[queueIndex++];
}

function renderQuestion(){
  locked=false;
  current=getNextQuestion();
  $("word").textContent=current.word;
  $("streakText").textContent=`${streak} / 10`;
  $("mistakeText").textContent=`おてつき ${mistakes} / 2`;
  $("progressBar").style.width=`${streak*10}%`;

  const distractors=shuffle(pool.filter(w=>w.id!==current.id)).slice(0,3);
  const choices=shuffle([current,...distractors]);
  const box=$("choices");
  box.innerHTML="";
  choices.forEach(choice=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=choice.meaning;
    b.addEventListener("click",()=>answer(choice,b));
    box.appendChild(b);
  });
  const fb=$("feedback");
  fb.textContent="";
  fb.className="feedback";
  startTimer();
}

function playSound(type){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext) return;
    const ctx=new AudioContext();
    const now=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if(type==="correct"){
      osc.type="sine";
      osc.frequency.setValueAtTime(660,now);
      osc.frequency.setValueAtTime(880,now+0.09);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(0.18,now+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
      osc.start(now); osc.stop(now+0.23);
    }else{
      osc.type="square";
      osc.frequency.setValueAtTime(220,now);
      osc.frequency.setValueAtTime(160,now+0.12);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(0.12,now+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+0.24);
      osc.start(now); osc.stop(now+0.25);
    }
    osc.addEventListener("ended",()=>ctx.close());
  }catch(e){
    // 音声が利用できない環境でもテスト自体は続行。
  }
}

function handleTimeout(){
  if(locked) return;
  locked=true;
  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);
  playSound("wrong");
  mistakes++;
  streak=0;
  const fb=$("feedback");
  fb.textContent=`時間切れ！ 正解は「${current.meaning}」`;
  fb.className="feedback ng";
  $("streakText").textContent="0 / 10";
  $("mistakeText").textContent=`おてつき ${mistakes} / 2`;
  $("progressBar").style.width="0%";
  const correctBtn=buttons.find(b=>b.textContent===current.meaning);
  if(correctBtn) correctBtn.classList.add("correct");
  if(mistakes>=2){setTimeout(()=>finish(false),850);return;}
  setTimeout(renderQuestion,850);
}

function answer(choice, button){
  if(locked) return;
  locked=true;
  stopTimer();
  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);
  const fb=$("feedback");
  if(choice.id===current.id){
    playSound("correct");
    button.classList.add("correct");
    streak++;
    fb.textContent="正解！";
    fb.className="feedback ok";
    $("streakText").textContent=`${streak} / 10`;
    $("progressBar").style.width=`${streak*10}%`;
    if(streak>=10){setTimeout(()=>finish(true),500);return;}
  }else{
    playSound("wrong");
    button.classList.add("wrong");
    const correctBtn=buttons.find(b=>b.textContent===current.meaning);
    if(correctBtn) correctBtn.classList.add("correct");
    mistakes++;
    streak=0;
    fb.textContent=`不正解。正解は「${current.meaning}」`;
    fb.className="feedback ng";
    $("streakText").textContent="0 / 10";
    $("mistakeText").textContent=`おてつき ${mistakes} / 2`;
    $("progressBar").style.width="0%";
    if(mistakes>=2){setTimeout(()=>finish(false),850);return;}
  }
  setTimeout(renderQuestion,850);
}

function finish(passed){
  stopTimer();
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  $("resultIcon").textContent=passed?"🎉":"😢";
  $("resultTitle").textContent=passed?"合格！":"不合格";
  $("resultMessage").textContent=passed?"10問連続正解、おめでとう！":"おてつきが2回になりました。もう一度挑戦しよう！";
  $("resultStreak").textContent=`${streak}問`;
  $("resultMistakes").textContent=`${mistakes}回`;
}

function goHome(){
  stopTimer();
  quizScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
}

document.querySelectorAll(".level").forEach(btn=>btn.addEventListener("click",()=>startGame(btn.dataset.level)));
$("quitBtn").addEventListener("click",goHome);
$("homeBtn").addEventListener("click",goHome);
$("retryBtn").addEventListener("click",()=>startGame(level));

</script>
